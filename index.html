<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THIRST TRACKER</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container d-flex justify-content-center align-items-center min-vh-100">

    <div class="tracker-card text-center">

        <h1 class="mb-4 text-dark fw-bold"> Thirst Tracker</h1>

        <!-- Goal Input -->
        <div class="input-group mb-3">
            <input type="number" id="goalInput" class="form-control" placeholder="Enter goal (ml)">
            <button class="btn btn-primary" onclick="setGoal()">Set</button>
        </div>

        <!-- Stats -->
        <p id="goalDisplay">Goal: 0 ml</p>
        <p id="intakeDisplay">Drank: 0 ml</p>
        <p id="remainingDisplay">Remaining: 0 ml</p>

        <!-- Progress Bar -->
        <div class="progress mb-3">
            <div id="progressBar" class="progress-bar"></div>
        </div>

        <!-- Buttons -->
        <div class="d-flex gap-2">
    <button class="btn btn-info w-50" onclick="addWater(250)">+250 ml</button>
    <button class="btn btn-info w-50" onclick="addWater(500)">+500 ml</button>
</div>

        <!-- Reset -->
        <button class="btn btn-danger w-100 mt-3" onclick="resetAll()">Reset</button>

    </div>

</div>

<script src="script.js"></script>
</body>
</html>
